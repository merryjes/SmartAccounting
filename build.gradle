plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.smartaccounting'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['resources']
        }
    }
}

dependencies {
    implementation files('lib/mysql-connector-j-9.7.0.jar')
}

javafx {
    version = '21.0.6'
    modules = ['javafx.controls']
}

application {
    mainClass = 'com.smartaccounting.ui.SmartAccountingApp'
}
